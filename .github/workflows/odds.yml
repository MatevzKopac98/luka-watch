name: Odds capture

on:
  schedule:
    # DraftKings posts player props on game day; these catch them through the US day up to tip-off.
    # Each run also refreshes the Lakers picks and republishes the site. UTC times; New York time in brackets.
    - cron: "23 15 * * *"   # (10:23) morning lines
    - cron: "23 19 * * *"   # (14:23)
    - cron: "13 23 * * *"   # (18:13) close to 7 pm tip-offs = closing lines
    - cron: "13 2 * * *"    # (21:13) closing lines for 10 pm West Coast games
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writer        # never write the data branch at the same time as the daily update
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture odds, refresh picks, build site
        run: python scripts/capture_odds.py
        env:
          BETTING_PASSWORD: ${{ secrets.BETTING_PASSWORD }}
      - name: Save data snapshot
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "Data snapshot $(date -u +%FT%H%MZ)"
          git push -q -f origin snapshot:data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Second copy at https://luka-watch.pages.dev (Cloudflare Pages): work web filters that block github.io
      # as "file sharing" let it through. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets;
      # skipped without them, and a Cloudflare hiccup never fails the run.
      - name: Publish copy to Cloudflare Pages
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "No Cloudflare secrets: skipped"; exit 0; fi
          npx --yes wrangler@4.20.0 pages project create luka-watch --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@4.20.0 pages deploy site --project-name=luka-watch --branch=main --commit-dirty=true
