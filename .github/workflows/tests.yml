name: Tests

# Fast offline checks of the parts that are easy to break silently: lineup stints from play-by-play,
# odds parsing, bet grading and stakes, encryption and snapshot pruning. They don't block the daily update.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
