name: Daily update

on:
  schedule:
    # GitHub cron is UTC. Scheduled runs can start late or be dropped entirely when GitHub is busy,
    # so several slots are spread over the morning; any one of them refreshes the page.
    # Odd minutes avoid the :00/:30 rush. Times below are Ljubljana winter time (UTC+1).
    - cron: "41 5 * * *"    # 06:41  main pass -> ready by 07:00
    - cron: "7 6 * * *"     # 07:07  backup if the main pass was dropped or late
    - cron: "37 6 * * *"    # 07:37  catches late West Coast games
    - cron: "13 7 * * *"    # 08:13  last safety net
    # Review game end times with: python scripts/end_times.py
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:                     # rebuild when code changes (the bot's own data commits don't re-trigger)
    branches: [main]
    paths-ignore: ["data/**", "site/**", "README.md"]

permissions:
  contents: write           # commit the updated database back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and build site
        run: python scripts/update.py
        continue-on-error: true   # a single failing source shouldn't block publishing the rest

      - name: Save database history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba.sqlite site
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
